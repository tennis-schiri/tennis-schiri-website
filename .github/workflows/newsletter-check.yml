name: Newsletter-Code prüfen (kein Upload)

on:
  push:
    paths:
      - 'public/newsletter.php'
      - 'public/newsletter-setup.php'
      - 'public/newsletter-admin.php'
      - 'public/newsletter-mail.php'
      - 'public/newsletter-template.php'
      - 'public/newsletter-events.php'
      - 'public/newsletter-partners.php'
      - 'scripts/build_newsletter_partners.py'
      - 'tests/newsletter-partners-test.php'
      - 'public/partner/index.html'
      - 'scripts/build_newsletter_events.py'
      - 'public/tournament-weather.php'
      - 'tests/outdoor-weather-test.php'
      - 'tests/newsletter-events-test.php'
      - 'public/turniere/index.html'
      - 'public/assets/tournament-calendar.js'
      - 'public/assets/tournament-detail.js'
      - 'public/assets/tournament-detail.css'
      - 'public/turniere/termin.html'
      - 'tests/tournament-detail-test.py'
      - 'public/index.html'
      - 'public/turnierinfos.php'
      - 'public/leistungen/index.html'
      - 'tests/newsletter-template-test.php'
      - 'public/newsletter/index.html'
      - 'public/assets/site.css'
      - '.github/workflows/newsletter-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP-Syntax und Website-Anbindung
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP linten
        shell: bash
        run: |
          set -euo pipefail
          php -v
          for file in public/newsletter.php public/newsletter-setup.php public/newsletter-admin.php public/newsletter-mail.php public/newsletter-template.php public/newsletter-events.php public/newsletter-partners.php tests/newsletter-template-test.php tests/newsletter-events-test.php tests/newsletter-partners-test.php; do
            php -l "$file"
          done
      - name: Aktuelle Termine aus den Website-Seiten extrahieren
        run: |
          python scripts/build_newsletter_events.py --output public/data/newsletter-events.json
          python scripts/build_newsletter_partners.py --output public/data/newsletter-partners.json
      - name: Kalender und Detailseiten prüfen
        run: |
          node --check public/assets/tournament-calendar.js
          node --check public/assets/tournament-detail.js
          python tests/tournament-detail-test.py
      - name: HTML-Newsletter testen (kein Versand)
        run: |
          php tests/newsletter-template-test.php
          php tests/newsletter-events-test.php
          php -l public/tournament-weather.php
          php -l tests/outdoor-weather-test.php
          php tests/outdoor-weather-test.php
          php tests/newsletter-partners-test.php
      - name: Newsletter-Einbindung und private Datenablage prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s public/newsletter/index.html
          grep -Fq 'action="/newsletter.php"' public/newsletter/index.html
          grep -Fq 'action="/newsletter.php"' public/index.html
          grep -Fq 'newsletter-datenschutz' public/datenschutz/index.html
          test ! -e public/tennis-schiri-newsletter-config.php
          test ! -e public/tennis-schiri-newsletter-data
          grep -Fq 'if len(pages) != 13:' .github/workflows/deploy-live.yml
          echo "Newsletter-Prüfung bestanden; kein Live-Upload."
