name: WORKSHOP – vollständige Website manuell live hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-schiri-workshop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Nur workshop.tennis-schiri.de aktualisieren
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Vollständiges Workshop-Paket rekonstruieren und prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(find workshop-site/bundle -maxdepth 1 -type f -name 'part[0-9][0-9]' | wc -l)" -eq 11
          cat workshop-site/bundle/part[0-9][0-9] > /tmp/workshop-full.zip
          echo '958b6b2004c56f65e2967c03979b102e04346a0b40707662483618c16d09f8b6  /tmp/workshop-full.zip' | sha256sum -c -
          unzip -tqq /tmp/workshop-full.zip
          mkdir -p _workshop_upload
          unzip -q /tmp/workshop-full.zip -d _workshop_upload
          for file in index.html assets/app.css assets/app.js assets/logo.png sw.js slides.json slides/slide-001.webp slides/slide-136.webp media/clip-107.mp4 media/clip-131.mp4; do
            test -s "_workshop_upload/$file" || { echo "::error::Datei fehlt: $file"; exit 1; }
          done
          slides="$(find _workshop_upload/slides -type f -name 'slide-*.webp' | wc -l)"
          videos="$(find _workshop_upload/media -type f -name 'clip-*.mp4' | wc -l)"
          test "$slides" -eq 136 || { echo "::error::Erwartet 136 Folien, vorhanden: $slides"; exit 1; }
          test "$videos" -eq 25 || { echo "::error::Erwartet 25 Videos, vorhanden: $videos"; exit 1; }
          grep -q "Tennis-Schiri Workshop-Präsentation" _workshop_upload/index.html
          grep -q "noindex,nofollow" _workshop_upload/index.html
          grep -q "Disallow: /" _workshop_upload/robots.txt
          node --check _workshop_upload/assets/app.js
          python -m json.tool _workshop_upload/slides.json >/dev/null
          echo "136 Folien, 25 Videos und Workshop-Steuerung geprüft."

      - name: Separate FTPS-Zugangsdaten prüfen
        shell: bash
        env:
          FTP_WORKSHOP_HOST: ${{ secrets.FTP_WORKSHOP_HOST }}
          FTP_WORKSHOP_USER: ${{ secrets.FTP_WORKSHOP_USER }}
          FTP_WORKSHOP_PASSWORD: ${{ secrets.FTP_WORKSHOP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_WORKSHOP_HOST" || { echo "::error::FTP_WORKSHOP_HOST fehlt"; exit 1; }
          test -n "$FTP_WORKSHOP_USER" || { echo "::error::FTP_WORKSHOP_USER fehlt"; exit 1; }
          test -n "$FTP_WORKSHOP_PASSWORD" || { echo "::error::FTP_WORKSHOP_PASSWORD fehlt"; exit 1; }

      - name: Nur in das Workshop-FTP-Startverzeichnis übertragen
        shell: bash
        env:
          FTP_WORKSHOP_HOST: ${{ secrets.FTP_WORKSHOP_HOST }}
          FTP_WORKSHOP_USER: ${{ secrets.FTP_WORKSHOP_USER }}
          FTP_WORKSHOP_PASSWORD: ${{ secrets.FTP_WORKSHOP_PASSWORD }}
        run: |
          set -euo pipefail
          # Sicherheitsvorgabe: dieser FTP-Benutzer MUSS im ALL-INKL KAS
          # auf /workshop-tennis-schiri-de/ begrenzt sein.
          # URLs beziehen sich auf das FTP-Startverzeichnis, keine Löschung.
          while IFS= read -r -d '' file; do
            relative="$(realpath --relative-to=_workshop_upload "$file")"
            echo "Workshop-Datei: $relative"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --retry 2 --connect-timeout 20 --max-time 120 \
              --user "$FTP_WORKSHOP_USER:$FTP_WORKSHOP_PASSWORD" \
              --upload-file "$file" "ftp://$FTP_WORKSHOP_HOST:21/$relative"
          done < <(find _workshop_upload -type f -print0 | sort -z)

      - name: Neue Subdomain prüfen
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -L -o /tmp/workshop-live.html -w '%{http_code}' \
            --max-time 35 -H 'Cache-Control: no-cache' \
            "https://workshop.tennis-schiri.de/?commit=$GITHUB_SHA")"
          if [ "$status" != "200" ]; then
            echo "::error::workshop.tennis-schiri.de meldet HTTP $status"
            exit 1
          fi
          if ! grep -q "Tennis-Schiri Workshop-Präsentation" /tmp/workshop-live.html; then
            echo "::error::Subdomain liefert nicht die neue Workshop-Präsentation. Bitte Domain-Zielverzeichnis im KAS prüfen."
            exit 1
          fi
          for path in slides/slide-001.webp slides/slide-136.webp media/clip-107.mp4 media/clip-131.mp4; do
            curl --head --fail --silent --show-error --location --retry 2 --max-time 35 "https://workshop.tennis-schiri.de/$path" -o /dev/null || exit 1
          done
          echo "136 Workshop-Folien und Videos sind unter workshop.tennis-schiri.de verfügbar."
