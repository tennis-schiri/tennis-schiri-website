name: WORKSHOP – Startseite und geschützten Bereich live hochladen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-schiri-workshop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Workshop separat ins FTP-Verzeichnis übertragen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python für die Folienbild-Erzeugung einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Workshop-Secrets prüfen
        shell: bash
        env:
          FTP_WORKSHOP_HOST: ${{ secrets.FTP_WORKSHOP_HOST }}
          FTP_WORKSHOP_USER: ${{ secrets.FTP_WORKSHOP_USER }}
          FTP_WORKSHOP_PASSWORD: ${{ secrets.FTP_WORKSHOP_PASSWORD }}
          WORKSHOP_ACCESS_PASSWORD: ${{ secrets.WORKSHOP_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_WORKSHOP_HOST" || { echo "::error::FTP_WORKSHOP_HOST fehlt"; exit 1; }
          test -n "$FTP_WORKSHOP_USER" || { echo "::error::FTP_WORKSHOP_USER fehlt"; exit 1; }
          test -n "$FTP_WORKSHOP_PASSWORD" || { echo "::error::FTP_WORKSHOP_PASSWORD fehlt"; exit 1; }
          test -n "$WORKSHOP_ACCESS_PASSWORD" || { echo "::error::WORKSHOP_ACCESS_PASSWORD fehlt"; exit 1; }
          if [ "$(printf %s "$WORKSHOP_ACCESS_PASSWORD" | wc -c)" -lt 12 ]; then
            echo "::error::WORKSHOP_ACCESS_PASSWORD muss mindestens 12 Zeichen lang sein."
            exit 1
          fi
          echo "Alle vier Secrets vorhanden. Passwort wird nicht im Log ausgegeben."

      - name: Präsentation rekonstruieren und sicheren Webroot erzeugen
        shell: bash
        env:
          WORKSHOP_ACCESS_PASSWORD: ${{ secrets.WORKSHOP_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(find workshop-site/bundle -maxdepth 1 -type f -name 'part[0-9][0-9]' | wc -l)" -eq 11
          cat workshop-site/bundle/part[0-9][0-9] > /tmp/workshop-full.zip
          echo '958b6b2004c56f65e2967c03979b102e04346a0b40707662483618c16d09f8b6  /tmp/workshop-full.zip' | sha256sum -c -
          unzip -tqq /tmp/workshop-full.zip
          mkdir -p /tmp/workshop-extracted _workshop_upload/_private _workshop_upload/assets
          unzip -q /tmp/workshop-full.zip -d /tmp/workshop-extracted

          # Öffentlich: nur Startseite, Login/PHP-Gateways und unsensitive UI-Assets.
          cp workshop-site/startseite.html _workshop_upload/index.html
          cp workshop-site/access.css _workshop_upload/access.css
          cp workshop-site/login.php workshop-site/logout.php workshop-site/security.php \
             workshop-site/resource.php workshop-site/presentation.php \
             workshop-site/teilnehmen.php workshop-site/live.php _workshop_upload/
          cp workshop-site/.htaccess workshop-site/robots.txt workshop-site/sw.js _workshop_upload/
          cp /tmp/workshop-extracted/assets/app.css _workshop_upload/assets/
          cp /tmp/workshop-extracted/assets/logo.png _workshop_upload/assets/
          # Das vom Nutzer bereitgestellte Tennis-Aktionsfoto, bereits als
          # Originalbild in der TS-Hauptwebsite, auch beim Workshop ausliefern.
          cp public/assets/michael-wiedeck-spiel.jpg _workshop_upload/assets/workshop-michael-tennis.jpg
          cp public/assets/michael-wiedeck-tennis.jpg _workshop_upload/assets/workshop-michael-portrait.jpg
          cp workshop-site/presenter-mode.css workshop-site/presenter-mode.js \
             workshop-site/workshop-slide.css workshop-site/workshop-slide.js \
             workshop-site/presenter-enhance.js workshop-site/participant.css workshop-site/participant.js _workshop_upload/assets/

          # Neue didaktische Reihenfolge: Bilder, Metadaten und Kapitel werden
          # aus dem geprüften Originalpaket gemeinsam rekonstruiert.
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow==11.3.0'
          python3 workshop-site/reorder.py
          cp workshop-site/deny-private.htaccess _workshop_upload/_private/.htaccess
          mkdir -p _workshop_upload/_private/live-state
          cp workshop-site/deny-private.htaccess _workshop_upload/_private/live-state/.htaccess

          # Service-Worker deaktivieren; alte Offline-Caches nicht weiter nutzen.
          # Im Hauptvortrag ist Folie 123 der Abschluss; die anschließenden
          # Bonus-/Archivfolien sind bewusst nur über die Kapitelwahl erreichbar.
          python3 - <<'PY'
          from pathlib import Path
          app = Path('_workshop_upload/assets/app.js')
          js = Path('/tmp/workshop-extracted/assets/app.js').read_text(encoding='utf-8')
          old = "if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});"
          new = ("if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations()"
                 ".then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})};"
                 "if('caches' in window){caches.keys().then(keys=>Promise.all(keys"
                 ".filter(k=>k.startsWith('ts-workshop-')).map(k=>caches.delete(k)))).catch(()=>{})};")
          replacements = (
              (old,new),
              ("function next(){if(at<S.length-1)jump(at+2)}",
               "function next(){if(at<S.length-1&&!S[at].main_end)jump(at+2)}"),
              ("byId('next-btn').disabled=at>=S.length-1;",
               "byId('next-btn').disabled=at>=S.length-1||!!s.main_end;"),
              ("case'End':e.preventDefault();jump(S.length);break;",
               "case'End':e.preventDefault();jump(S.find(s=>s.main_end)?.no||S.length);break;"),
              ("Erste / letzte Folie","Erste / Abschlussfolie"),
              ("counter.textContent=String(s.no).padStart(3,'0')+' / '+S.length;",
               "counter.textContent=s.no<=parsed.main_end?(String(s.no).padStart(3,'0')+' / '+parsed.main_end):('BONUS '+String(s.no-parsed.main_end).padStart(2,'0')+' / '+(S.length-parsed.main_end));"),
              ("progress.style.width=(100*s.no/S.length)+'%';",
               "progress.style.width=(100*(s.no<=parsed.main_end?s.no/parsed.main_end:(s.no-parsed.main_end)/(S.length-parsed.main_end)))+'%';"),
              ("window.__workshop={slideCount:S.length,",
               "window.__workshop={mainSlideCount:parsed.main_end,bonusSlideCount:S.length-parsed.main_end,slideCount:S.length,"),
          )
          for before,after in replacements:
              if js.count(before) != 1:
                  raise SystemExit('Presenter-JavaScript unerwartet verändert: ' + before[:75])
              js=js.replace(before,after,1)
          app.write_text(js,encoding='utf-8')
          # Versionierte Assets verhindern, dass die frühere Reihenfolge aus
          # Browser-Caches geladen wird, obwohl die neuen Bilder bereits online sind.
          deck = Path('_workshop_upload/_private/index.html')
          html = deck.read_text(encoding='utf-8')
          if html.count('20261117-1') != 2:
              raise SystemExit('CSS/JS Versionierung in Workshop HTML unerwartet')
          html = html.replace('20261117-1','20261118-v4')
          # Die zusätzliche Präsentationsansicht wird nach dem regulären
          # Player geladen und übernimmt dessen bestehende F/Vollbild-Taste.
          if html.count('</head>') != 1 or html.count('</body>') != 1:
              raise SystemExit('Ungewöhnliche Dokumentstruktur; Vollbild-Integration abgebrochen')
          html = html.replace('</head>', '<link rel="stylesheet" href="assets/presenter-mode.css?v=20261118-2"><link rel="stylesheet" href="assets/workshop-slide.css?v=20261118-6"></head>', 1)
          html = html.replace('</body>', '<script src="assets/workshop-slide.js?v=20261118-6" defer></script><script src="assets/presenter-enhance.js?v=20261118-6" defer></script><script src="assets/presenter-mode.js?v=20261118-2" defer></script></body>', 1)
          deck.write_text(html,encoding='utf-8')
          PY

          # Hash nur aus GitHub Secret erzeugen, nie das Klartext-Passwort veröffentlichen.
          php -r 'file_put_contents("_workshop_upload/_private/password-hash.php", "<?php\nreturn " . var_export(password_hash(getenv("WORKSHOP_ACCESS_PASSWORD"), PASSWORD_DEFAULT), true) . ";\n");'
          unset WORKSHOP_ACCESS_PASSWORD

          test "$(find _workshop_upload/_private/slides -type f -name 'slide-*.webp' | wc -l)" -eq 136
          test "$(find _workshop_upload/_private/media -type f -name 'clip-*.mp4' | wc -l)" -eq 25
          for file in \
            index.html access.css login.php security.php resource.php \
            presentation.php logout.php teilnehmen.php live.php .htaccess robots.txt sw.js \
            _private/index.html _private/slides.json _private/password-hash.php \
            _private/.htaccess _private/slides/slide-001.webp _private/slides/slide-136.webp \
            _private/media/clip-107.mp4 _private/media/clip-131.mp4 \
            assets/app.css assets/app.js assets/logo.png \
            assets/presenter-mode.css assets/presenter-mode.js assets/workshop-michael-tennis.jpg \
            assets/workshop-michael-portrait.jpg assets/workshop-slide.css assets/workshop-slide.js \
            assets/presenter-enhance.js assets/participant.css assets/participant.js; do
            test -s "_workshop_upload/$file" || { echo "::error::Fehlende Datei: $file"; exit 1; }
          done
          grep -q 'KENNST DU' _workshop_upload/index.html
          grep -q 'Backend' _workshop_upload/index.html
          grep -q 'https://tennis-schiri.de/' _workshop_upload/index.html
          grep -q 'Tennis-Schiri Workshop-Präsentation' _workshop_upload/_private/index.html
          grep -q 'Require all denied' _workshop_upload/_private/.htaccess
          grep -q 'RewriteRule .*slides/' _workshop_upload/.htaccess
          ! grep -q 'serviceWorker.register' _workshop_upload/assets/app.js
          test -s _workshop_upload/_private/original-to-current.json
          grep -q 'main_end' _workshop_upload/_private/slides.json
          grep -q 'presenter-mode.js' _workshop_upload/_private/index.html
          grep -q 'workshop-slide.js' _workshop_upload/_private/index.html
          grep -q 'presenter-enhance.js' _workshop_upload/_private/index.html
          grep -q 'participant.js' _workshop_upload/teilnehmen.php
          grep -q 'live.php' _workshop_upload/assets/participant.js
          grep -q 'presenter-mode.css' _workshop_upload/_private/index.html
          grep -q 'workshop-michael-tennis.jpg' _workshop_upload/index.html
          test "$(wc -c < _workshop_upload/assets/workshop-michael-tennis.jpg)" -gt 100000
          node --check _workshop_upload/assets/presenter-mode.js
          node --check _workshop_upload/assets/workshop-slide.js
          node --check _workshop_upload/assets/presenter-enhance.js
          node --check _workshop_upload/assets/participant.js
          node --check _workshop_upload/assets/app.js
          python3 -m json.tool _workshop_upload/_private/slides.json > /dev/null
          for php_file in _workshop_upload/*.php _workshop_upload/_private/password-hash.php; do
            php -l "$php_file" >/dev/null
          done
          echo "Startseite, serverseitiger Passwortschutz, 136 Folien und 25 Videos geprüft."

      - name: Nur Workshop-FTP-Webspace per FTPS aktualisieren
        shell: bash
        env:
          FTP_WORKSHOP_HOST: ${{ secrets.FTP_WORKSHOP_HOST }}
          FTP_WORKSHOP_USER: ${{ secrets.FTP_WORKSHOP_USER }}
          FTP_WORKSHOP_PASSWORD: ${{ secrets.FTP_WORKSHOP_PASSWORD }}
        run: |
          set -euo pipefail
          # ALL-INKL FTP-Benutzer MUSS bereits auf
          # /workshop-tennis-schiri-de/ eingeschränkt sein.
          # Der Workflow löscht NICHTS und fasst die Hauptwebsite NICHT an.
          upload_one() {
            local file="$1"
            local relative
            relative="$(realpath --relative-to=_workshop_upload "$file")"
            echo "Lade hoch: $relative"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --retry 2 --connect-timeout 20 --max-time 120 \
              --user "$FTP_WORKSHOP_USER:$FTP_WORKSHOP_PASSWORD" \
              --upload-file "$file" "ftp://$FTP_WORKSHOP_HOST:21/$relative"
          }
          # Sicherheitsregeln zuerst aktivieren, auch für alte Medien.
          upload_one _workshop_upload/.htaccess
          upload_one _workshop_upload/_private/.htaccess
          upload_one _workshop_upload/_private/live-state/.htaccess
          # Öffentliche Startseite erst ganz zum Schluss austauschen.
          while IFS= read -r -d '' file; do
            case "$file" in
              _workshop_upload/.htaccess|_workshop_upload/_private/.htaccess|_workshop_upload/_private/live-state/.htaccess|_workshop_upload/index.html) continue ;;
            esac
            upload_one "$file"
          done < <(find _workshop_upload -type f -print0 | sort -z)
          upload_one _workshop_upload/index.html
          echo "Sicherer Workshop-Webspace übertragen."

      - name: Startseite und echten Passwortschutz verifizieren
        shell: bash
        run: |
          set -euo pipefail
          base="https://workshop.tennis-schiri.de"
          http_code() {
            curl -sS -o /tmp/workshop-check-body -D /tmp/workshop-check-headers \
              -w '%{http_code}' --max-time 40 -H 'Cache-Control: no-cache' "$1"
          }
          code="$(http_code "$base/?commit=$GITHUB_SHA")"
          test "$code" = "200" || { echo "::error::Startseite HTTP $code"; exit 1; }
          grep -q 'KENNST DU' /tmp/workshop-check-body || { echo "::error::Startseite nicht aktualisiert"; exit 1; }
          code="$(http_code "$base/login.php")"
          test "$code" = "200" || { echo "::error::Login HTTP $code"; exit 1; }
          code="$(http_code "$base/teilnehmen.php")"
          test "$code" = "302" || { echo "::error::Teilnehmeransicht ohne Passwort erreichbar (HTTP $code)"; exit 1; }
          code="$(http_code "$base/live.php?op=status&room=ABC234")"
          test "$code" = "401" || { echo "::error::Live-Endpunkt nicht geschützt (HTTP $code)"; exit 1; }
          code="$(http_code "$base/presentation.php")"
          test "$code" = "302" || { echo "::error::Präsentation ohne Passwort erreichbar (HTTP $code)"; exit 1; }
          code="$(http_code "$base/slides/slide-001.webp")"
          test "$code" = "401" || { echo "::error::Folienbild nicht geschützt (HTTP $code)"; exit 1; }
          code="$(http_code "$base/media/clip-107.mp4")"
          test "$code" = "401" || { echo "::error::Videodatei nicht geschützt (HTTP $code)"; exit 1; }
          code="$(http_code "$base/slides.json")"
          test "$code" = "401" || { echo "::error::Metadaten nicht geschützt (HTTP $code)"; exit 1; }
          code="$(http_code "$base/_private/slides/slide-001.webp")"
          test "$code" = "403" || { echo "::error::Privatordner nicht gesperrt (HTTP $code)"; exit 1; }
          echo "✓ Öffentliche Startseite und Passwortsperre erfolgreich geprüft."
