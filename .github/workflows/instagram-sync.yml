name: Instagram-Beiträge automatisch aktualisieren

on:
  schedule:
    # Täglich am frühen Morgen, UTC; ausschließlich Feed-Dateien werden hochgeladen.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-schiri-instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Beide Instagram-Konten abrufen (Unified Login)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Prüfen, ob beide Instagram-Token vorhanden sind
        id: setup
        shell: bash
        env:
          IG_TOKEN_TENNIS_SCHIRI: ${{ secrets.IG_TOKEN_TENNIS_SCHIRI }}
          IG_TOKEN_TENNILO: ${{ secrets.IG_TOKEN_TENNILO }}
        run: |
          set -euo pipefail
          if [[ -n "${IG_TOKEN_TENNIS_SCHIRI}" && -n "${IG_TOKEN_TENNILO}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Die beiden Instagram-Token-Secrets müssen in GitHub hinterlegt werden."
          fi

      - name: Python vorbereiten
        if: steps.setup.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Feed-Prüfungen ausführen
        if: steps.setup.outputs.enabled == 'true'
        run: python -m unittest discover -s tests -v

      - name: Instagram über Unified Login synchronisieren
        if: steps.setup.outputs.enabled == 'true'
        env:
          IG_TOKEN_TENNIS_SCHIRI: ${{ secrets.IG_TOKEN_TENNIS_SCHIRI }}
          IG_TOKEN_TENNILO: ${{ secrets.IG_TOKEN_TENNILO }}
        run: python scripts/sync_instagram.py

      - name: Neue Vorschaubilder im Repository speichern
        if: steps.setup.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "tennis-schiri Instagram Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/data/instagram.json public/assets/instagram
          if ! git diff --cached --quiet; then
            git commit -m "Instagram-Feed aktualisieren [skip ci]"
            git push origin HEAD:main
          else
            echo "Keine Änderungen zu committen."
          fi

      - name: Nur Feed und Vorschaubilder per FTPS veröffentlichen
        if: steps.setup.outputs.enabled == 'true'
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"
          shopt -s nullglob
          files=(public/data/instagram.json public/assets/instagram/*.jpg public/assets/instagram/*.png public/assets/instagram/*.webp)
          for file in "${files[@]}"; do
            [[ -s "${file}" ]] || continue
            remote="${file#public/}"
            echo "Lade Instagram-Datei ${remote} hoch"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --retry 2 --connect-timeout 20 --max-time 120 \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "${file}" \
              "ftp://${FTP_HOST}:21/${remote}"
          done
          echo "Instagram-Vorschaudaten wurden aktualisiert."
