name: Website per FTPS veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-schiri-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Testwebsite sicher hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Website aus GitHub abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Website-Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/index.html \
            public/turniere/index.html \
            public/ueber-mich/index.html \
            public/referenzen/index.html \
            public/leistungen/index.html \
            public/regelwissen/index.html \
            public/kontakt/index.html \
            public/aktuelles/index.html \
            public/impressum/index.html \
            public/datenschutz/index.html \
            public/assets/site.css \
            public/assets/michael-wiedeck-portrait.jpg \
            public/assets/michael-wiedeck-tennis.jpg \
            public/assets/michael-wiedeck-spiel.jpg \
            public/robots.txt; do
            test -s "$file" || { echo "::error::Fehlende Datei: $file"; exit 1; }
          done
          for file in public/index.html public/*/index.html; do
            grep -qi 'noindex' "$file" || { echo "::error::noindex fehlt: $file"; exit 1; }
          done

      - name: Website-Dateien per FTPS in das Testverzeichnis hochladen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt}"
          : "${FTP_USER:?FTP_USER fehlt}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt}"

          # Wichtig: KAS-FTP-Benutzer ist auf /tennis-schiri-neu/ beschränkt.
          # Kein Löschen, kein Zugriff auf WordPress und keine Server-Konfiguration.
          for file in \
            public/assets/site.css \
            public/assets/michael-wiedeck-portrait.jpg \
            public/assets/michael-wiedeck-tennis.jpg \
            public/assets/michael-wiedeck-spiel.jpg \
            public/turniere/index.html \
            public/ueber-mich/index.html \
            public/referenzen/index.html \
            public/leistungen/index.html \
            public/regelwissen/index.html \
            public/kontakt/index.html \
            public/aktuelles/index.html \
            public/impressum/index.html \
            public/datenschutz/index.html \
            public/robots.txt \
            public/index.html; do
            remote="${file#public/}"
            echo "Übertrage ${remote} ..."
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --connect-timeout 20 --max-time 120 \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "${file}" \
              "ftp://${FTP_HOST}:21/${remote}"
          done
          echo "Website-Dateien für die Test-Subdomain wurden übertragen."
