name: Live-Website in separaten Webspace veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-schiri-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Produktivversion nach tennis-schiri-live laden
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Freigegebenes TS-09c-Logo-Set bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site_branding.py --output public/assets/branding
          test -s public/assets/branding/ts-logo-hell.png
          test -s public/assets/branding/ts-logo-dunkel.png
          test -s public/assets/branding/ts-logo-ball.png
          test -s public/assets/branding/ts-favicon.png

      - name: Separate Zugangsdaten für den Live-Ordner prüfen
        shell: bash
        env:
          FTP_LIVE_HOST: ${{ secrets.FTP_LIVE_HOST }}
          FTP_LIVE_USER: ${{ secrets.FTP_LIVE_USER }}
          FTP_LIVE_PASSWORD: ${{ secrets.FTP_LIVE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_LIVE_HOST:?GitHub Secret FTP_LIVE_HOST fehlt}"
          : "${FTP_LIVE_USER:?GitHub Secret FTP_LIVE_USER fehlt}"
          : "${FTP_LIVE_PASSWORD:?GitHub Secret FTP_LIVE_PASSWORD fehlt}"
          echo "Separate Live-Zugangsdaten sind hinterlegt."

      - name: Produktivdateien getrennt aus der Testversion erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import re
          import shutil
          import xml.etree.ElementTree as ET

          src = pathlib.Path("public")
          out = pathlib.Path("_live_upload")
          if out.exists():
              shutil.rmtree(out)
          shutil.copytree(src, out)
          # Nur die 13 eigentlichen Inhaltsseiten erhalten die Live-Robots-Regeln.
          # Die Google-Search-Console-Bestaetigungsdatei bleibt unveraendert.
          pages = sorted(out.rglob("index.html"))
          if len(pages) != 13:
              raise SystemExit(f"Erwartet 13 Seiten, gefunden: {len(pages)}")
          for page in pages:
              raw = page.read_text(encoding="utf-8")
              rel = "assets" if page == out / "index.html" else "../assets"
              expected_css = f'<link rel="stylesheet" href="{rel}/site.css?v=20261107-3">'
              expected_script = f'<script src="{rel}/back-to-top.js?v=2" defer></script>'
              if expected_css not in raw or expected_script not in raw:
                  raise SystemExit(f"Stylesheet oder Nach-oben-Skript fehlerhaft eingebunden: {page}")
              pattern = r'<meta\s+name=["\']robots["\']\s+content=["\']noindex\s*,\s*nofollow\s*,\s*noarchive["\']\s*/?>'
              cleaned, count = re.subn(pattern, "", raw, count=1, flags=re.IGNORECASE)
              if count != 1:
                  raise SystemExit(f"Fehlende oder unerwartete noindex-Angabe: {page}")
              if 'Entwicklungsfassung' in cleaned or 'Entwurfsseiten' in cleaned:
                  raise SystemExit(f"Ungeprüfter Entwicklungsvermerk: {page}")
              page.write_text(cleaned, encoding="utf-8")
          # Sitemap ausschließlich aus echten Inhaltsseiten erzeugen.
          # Die Google-Bestaetigungsdatei ist keine Inhaltsseite.
          namespace = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", namespace)
          urlset = ET.Element(f"{{{namespace}}}urlset")
          for page in sorted(pages, key=lambda item: (item != out / "index.html", str(item))):
              relative_parent = page.parent.relative_to(out)
              site_path = "/" if relative_parent == pathlib.Path(".") else f"/{relative_parent.as_posix()}/"
              url = ET.SubElement(urlset, f"{{{namespace}}}url")
              ET.SubElement(url, f"{{{namespace}}}loc").text = f"https://tennis-schiri.de{site_path}"
          tree = ET.ElementTree(urlset)
          ET.indent(tree, space="  ")
          tree.write(out / "sitemap.xml", encoding="utf-8", xml_declaration=True)
          (out / "robots.txt").write_text(
              "User-agent: *\\nAllow: /\\n\\nSitemap: https://tennis-schiri.de/sitemap.xml\\n",
              encoding="utf-8",
          )
          (out / ".htaccess").write_text("# Kanonische Domain (unabhaengig von der alten WordPress-Installation)\nRewriteEngine On\nRewriteCond %{HTTP_HOST} ^www\\.tennis-schiri\\.de$ [NC]\nRewriteRule ^(.*)$ https://tennis-schiri.de/$1 [R=301,L]\n\n# Alte WordPress-Pfade auf passende neue Informationsseiten umleiten\nRewriteRule ^anfrage/?$ /kontakt/ [R=301,L]\nRewriteRule ^black-sea-games/?$ /partner/ [R=301,L]\nRewriteRule ^veranstaltungen/?$ /turniere/ [R=301,L]\nRewriteRule ^veranstaltungen/kalender/?$ /turniere/ [R=301,L]\nRewriteRule ^veranstaltungen/meine-buchungen/?$ /turniere/ [R=301,L]\nRewriteRule ^2026/06/15/neuer-livescore-bei-meinen-turnieren/?$ /aktuelles/ [R=301,L]\nRewriteRule ^2025/10/09/save-the-date-hallen-lk-turniere-in-neuenhagen-bei-berlin-2025-2026/?$ /turniere/ [R=301,L]\nRewriteRule ^2025/10/01/save-the-date-hallen-lk-turniere-in-bad-saarow/?$ /turniere/ [R=301,L]\nRewriteRule ^2021/04/13/lk-turniere-in-der-gartenstadt-neuenhagen-bei-berlin-2021/?$ /turniere/ [R=301,L]\nRewriteRule ^2021/04/13/hello-world/?$ /ueber-mich/ [R=301,L]\n", encoding="utf-8")
          for required in [
              "index.html", "impressum/index.html", "datenschutz/index.html",
              "favicon.svg", "assets/site.css", "assets/instagram.js",
              "assets/branding/ts-logo-hell.png",
              "assets/branding/ts-logo-dunkel.png",
              "assets/branding/ts-logo-ball.png",
              "assets/branding/ts-favicon.png",
              "assets/back-to-top.js",
              "data/instagram.json", "data/statistics.json",
              "assets/statistics.js", "statistiken/index.html",
              "newsletter/index.html", "newsletter.php", "newsletter-setup.php",
              "newsletter-admin.php", "newsletter-mail.php", "newsletter-template.php",
              "newsletter-events.php", "newsletter-partners.php",
              "google8cf6756d83169a32.html",
              "sitemap.xml",
          ]:
              file = out / required
              if not file.is_file() or not file.stat().st_size:
                  raise SystemExit(f"Fehlende Live-Datei: {file}")
          if (src / "robots.txt").read_text(encoding="utf-8").find("Disallow: /") == -1:
              raise SystemExit("Staging-Schutz wurde unerwartet geändert")
          print(f"Live-Version mit {len(pages)} Seiten erstellt; Staging bleibt gesperrt.")
          PY

      - name: Newsletter-PHP und Datensicherheit prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -l public/newsletter.php
          php -l public/newsletter-setup.php
          php -l public/newsletter-admin.php
          php -l public/newsletter-mail.php
          # Katalog vor jedem Upload frisch aus den Turnier-/Workshopseiten erzeugen.
          python scripts/build_newsletter_events.py --output public/data/newsletter-events.json
          cp public/data/newsletter-events.json _live_upload/data/newsletter-events.json
          test -s _live_upload/data/newsletter-events.json
          # Partnerschaftslogos und TENNILO: aus der Partnerseite, kein manuelles Nachpflegen.
          python scripts/build_newsletter_partners.py --output public/data/newsletter-partners.json
          cp public/data/newsletter-partners.json _live_upload/data/newsletter-partners.json
          test -s _live_upload/data/newsletter-partners.json
          php -l public/newsletter-events.php
          php -l tests/newsletter-events-test.php
          php -l public/newsletter-template.php
          php -l tests/newsletter-template-test.php
          php tests/newsletter-template-test.php
          php tests/newsletter-events-test.php
          php -l public/newsletter-partners.php
          php -l tests/newsletter-partners-test.php
          php tests/newsletter-partners-test.php
          python tests/site-branding-test.py
          test -s public/newsletter/index.html
          # Private Konfiguration und personenbezogene Datensaetze gehoeren nicht ins Repository.
          test ! -e public/tennis-schiri-newsletter-config.php
          test ! -e public/tennis-schiri-newsletter-data
          test ! -e _live_upload/tennis-schiri-newsletter-config.php
          test ! -e _live_upload/tennis-schiri-newsletter-data
          echo "Newsletter-Skripte geprüft; keine privaten Daten im Upload."

      - name: Live-Dateien ausschließlich ins freigegebene FTP-Verzeichnis laden
        shell: bash
        env:
          FTP_LIVE_HOST: ${{ secrets.FTP_LIVE_HOST }}
          FTP_LIVE_USER: ${{ secrets.FTP_LIVE_USER }}
          FTP_LIVE_PASSWORD: ${{ secrets.FTP_LIVE_PASSWORD }}
        run: |
          set -euo pipefail
          # Der FTP_LIVE_USER muss im KAS auf /tennis-schiri-live/ begrenzt sein.
          # Es wird kein WordPress-Verzeichnis angefasst und nichts gelöscht.
          while IFS= read -r -d '' file; do
            relative="${file#_live_upload/}"
            echo "Live-Datei: ${relative}"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --retry 2 --connect-timeout 20 --max-time 120 \
              --user "${FTP_LIVE_USER}:${FTP_LIVE_PASSWORD}" \
              --upload-file "${file}" \
              "ftp://${FTP_LIVE_HOST}:21/${relative}"
          done < <(find _live_upload -type f -print0 | sort -z)
          echo "Produktivdateien liegen im separaten Live-Ordner. Die Hauptdomain wird NICHT automatisch umgestellt."
